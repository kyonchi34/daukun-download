<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-/+iV8GD1JQQ6VNdFepLAPwYYi0+7v8yMkz5l7ey22Pw='; style-src 'unsafe-inline'; frame-src https://www.youtube.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>DAUKUN アーカイブ再生</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; color: #fff; }
    body { font-family: "Hiragino Sans", "Yu Gothic UI", sans-serif; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    p { margin: 0; padding: 20px; line-height: 1.6; }
  </style>
</head>
<body>
  <noscript><p>動画を再生するにはJavaScriptを有効にしてください。</p></noscript>
  <script>
  (() => {
    'use strict';
    // The fragment contains only a YouTube video ID. No account information is accepted.
    const id = new URLSearchParams(location.hash.slice(1)).get('v') || '';
    if (!/^[A-Za-z0-9_-]{11}$/.test(id)) {
      const message = document.createElement('p');
      message.textContent = '動画を読み込めませんでした。一度閉じて、もう一度再生してください。';
      document.body.appendChild(message);
      return;
    }
    const player = document.createElement('iframe');
    player.title = 'YouTubeアーカイブ再生';
    player.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    player.allowFullscreen = true;
    player.referrerPolicy = 'strict-origin-when-cross-origin';
    const url = new URL('https://www.youtube.com/embed/' + id);
    url.search = new URLSearchParams({autoplay: '1', rel: '0', playsinline: '1', origin: location.origin}).toString();
    player.src = url.href;
    document.body.appendChild(player);
    const stop = () => { player.removeAttribute('src'); player.remove(); };
    window.addEventListener('pagehide', stop);
    document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); });
  })();
  </script>
</body>
</html>
